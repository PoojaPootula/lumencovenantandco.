{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1>Edit Card</h1>

    <form method="POST">

        <input type="text" name="name" value="{{ card.name }}" required>
        <textarea name="description">{{ card.short_description }}</textarea>

        <label>
            <input type="checkbox" name="featured" {% if card.featured %}checked{% endif %}>
            Featured
        </label>

        <label>
            <input type="checkbox" name="active" {% if card.active %}checked{% endif %}>
            Active
        </label>

        <button type="submit">
            Update
        </button>

    </form>

</div>

{% endblock %}
